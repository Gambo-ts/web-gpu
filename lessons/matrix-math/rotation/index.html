<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Gambo Starter — Rotation</title>
</head>

<body>
	<a class="gambo-badge" href="/">← Gambo Starter</a>
	<canvas></canvas>
	<div id="circle"></div>
	<script type="module" src="./main.ts"></script>

	<style>
		.gambo-badge { position: fixed; top: 8px; left: 8px; z-index: 10; font: 12px/1.4 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 999px; text-decoration: none; }
		.gambo-badge:hover { background: rgba(0,0,0,.8); }
		html,
		body {
			margin: 0;
			height: 100%;
		}

		:root {
			--bg-color: #fff;
			--line-color-1: #aaa;
			--line-color-2: #ddd;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg-color: #000;
				--line-color-1: #666;
				--line-color-2: #333;
			}
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
			background-color: var(--bg-color);
			background-image:
				linear-gradient(var(--line-color-1) 1.5px, transparent 1.5px),
				linear-gradient(90deg, var(--line-color-1) 1.5px, transparent 1.5px),
				linear-gradient(var(--line-color-2) 1px, transparent 1px),
				linear-gradient(90deg, var(--line-color-2) 1px, transparent 1px);
			background-position:
				-1.5px -1.5px,
				-1.5px -1.5px,
				-1px -1px,
				-1px -1px;
			background-size:
				100px 100px,
				100px 100px,
				10px 10px,
				10px 10px;
		}
	</style>
</body>

</html>
